<!DOCTYPE html>
<html>
<head>
	<meta charset="ISO-8859-1">
	<title>Student registration form</title>
</head>

<body>  
    <form action="helloworld.jsp">
    	First Name : <input type="text" name="firstname"/><br><br>
    	Last Name : <input type="text" name="lastname"/><br><br>
    	Country : <select name="country">
    		<option>Kenya</option>
    		<option>Uganda</option>
    		<option>Tanzania</option>
    		<option>Rwanda</option>
    		<option>Ethiopia</option>
    	</select><br><br>
    	Programming Language: 
    		<input type="radio" name="pro_lang" value="Java">Java
    		<input type="radio" name="pro_lang" value="PHP">PHP
    		<input type="radio" name="pro_lang" value="Python">Python
    		<input type="radio" name="pro_lang" value="C#">C#
    		<input type="radio" name="pro_lang" value="Kotlin">Kotlin
    		<input type="radio" name="pro_lang" value="JavaScript">JS<br><br>
    	Favorite Foods: 
    		<input type="checkbox" name="fav_food" value="Fish">Fish
    		<input type="checkbox" name="fav_food" value="Chips">Chips
    		<input type="checkbox" name="fav_food" value="Chicken">Chicken
    		<input type="checkbox" name="fav_food" value="Rice">Rice
    		<input type="checkbox" name="fav_food" value="Tea">Tea
    		<input type="checkbox" name="fav_food" value="Coffee">Coffee<br><br>
    	<input type="submit" value="Submit"/>
    </form>
</body>
</html>
